# ~/.config/environment.d/10-path.conf  →  symlink to dotfiles/env/10-path.conf
# systemd hands this to the whole GNOME session, so apps launched from the
# dock or Super+key (Emacs, VS Code) see the same PATH as your terminal.
# Takes effect at next login.
PATH=$HOME/.local/bin:$HOME/.npm-global/bin:$HOME/.config/emacs/bin:$PATH
