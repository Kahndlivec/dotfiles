# ═══════════════════════════════════════════════════════════════════════════
#  App shortcuts — THIS is the file to edit.
#
#  After editing:   ~/dotfiles/install.sh gnome
#  Check them:      ~/dotfiles/install.sh check     (GNOME keys section)
#
#  One app per line:   key(s)   app
#    key(s)  <Super>x, <Super><Shift>x, <Primary> means Ctrl. Several keys
#            separated by spaces. A single - means "in the dock, no key".
#    app     the .desktop file name. Alternatives separated by | — the first
#            one installed is used. List what's installed with:
#              ls /usr/share/applications ~/.local/share/applications /var/lib/snapd/desktop/applications
#
#  Keys are run-or-raise: jump to the app if it's open, start it if not.
#
#  How it works, and the one rule: GNOME ties these keys to POSITIONS in the
#  dock (1st icon, 2nd icon, …), so this file also sets the dock, in this
#  order. Pinning more apps by hand is fine — they go at the end. But dragging
#  or unpinning the icons listed here shifts every key after them. If that
#  happens, just run  ~/dotfiles/install.sh gnome  again.
# ═══════════════════════════════════════════════════════════════════════════

<Super>e                   emacs.desktop|emacs_emacs.desktop
<Super>t <Super>Return     com.mitchellh.ghostty.desktop|ghostty_ghostty.desktop
<Super>b                   brave-browser.desktop|brave_brave.desktop
<Super>v                   io.neovim.nvim.desktop
<Super>c                   code.desktop|code_code.desktop
<Super>m                   spotify_spotify.desktop|spotify.desktop
<Super>f                   org.gnome.Nautilus.desktop
-                          telegram-desktop_telegram-desktop.desktop|org.telegram.desktop.desktop
