# ═══════════════════════════════════════════════════════════════════
#  ~/.tmux.conf
#
#  Leader is Ctrl+Space — Control pinky + thumb on your HHKB.
#  Hold nothing else. Press the leader, release, then a plain letter.
#
#  Pane movement is C-h C-j C-k C-l with NO leader, and it crosses the
#  nvim/tmux border transparently. See the navigator section below.
#
#  Reload after editing:  C-Space  then  r
# ═══════════════════════════════════════════════════════════════════


# ─── The leader ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space

# Press C-Space twice to send a real C-Space through to the app.
# blink.cmp uses it to force the completion menu open — this is your
# escape hatch for that.
bind C-Space send-prefix


# ─── Splits ────────────────────────────────────────────────────────
# v / s match vim's :vsplit and :split. New panes open in the
# directory you were already in, not your home folder.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Capital letters resize. -r means you can hold the letter and repeat
# without pressing the leader again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Built in and worth knowing: z zooms a pane full-screen,
# x closes it (with a confirmation), space cycles pane layouts.


# ─── vim-tmux-navigator ────────────────────────────────────────────
# C-hjkl moves between panes without the leader. Before moving, tmux
# asks "is the process in this pane nvim?" — if yes it forwards the
# keystroke so nvim moves its own split; if no, tmux moves the pane.
# One set of keys, one muscle memory, both programs.
#
# The Neovim half is ALREADY in ~/.config/nvim/init.lua — the plugin
# is in the lazy list and the old <C-hjkl> -> <C-w>hjkl mappings were
# removed so the plugin owns those keys. Nothing more to add there.

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# C-l was your shell's "clear screen". The navigator ate it, so it
# moves to the leader: C-Space then C-l.
bind C-l send-keys 'C-l'

# Same keys work while you're in copy mode.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Fallback: if C-hjkl ever gets swallowed by a full-screen program
# (htop, less, a TUI), the leader versions still work.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# ─── Windows (tabs) ────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window

# One key that shows every session and window as a tree, with search.
# This replaces the default `s`, which v/s took over above.
bind w choose-tree -Zs


# ─── Defaults that actually matter ─────────────────────────────────

# THE important one. tmux waits 500ms after Esc by default, which
# makes vim feel broken and laggy. 10ms fixes it.
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Lets neovim's autoread checktime autocmd fire when you switch panes.
set -g focus-events on

# Keep the session alive when the last window in it closes, instead
# of dumping you back to a bare shell.
set -g detach-on-destroy off


# ─── Scrollback: vim keys ──────────────────────────────────────────
# C-Space then Enter enters copy mode. Then move with hjkl / C-u / C-d
# and search with / just like vim. v starts a selection, C-v toggles
# block selection, y copies to the system clipboard, q quits.
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Clipboard: wl-copy on the Wayland desktop. Over SSH (no Wayland socket)
# tmux falls back to OSC 52, which Ghostty forwards to the local clipboard.
set -s set-clipboard on
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null' \
  "set -s copy-command 'wl-copy'"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear



# ─── Colours: without these, monokai-pro looks wrong ───────────────
# tmux-256color comes from the ncurses-term package (install.sh adds it).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

# Undercurls, so LSP diagnostics squiggle instead of flat-underlining.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# ─── Reload this file ──────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
