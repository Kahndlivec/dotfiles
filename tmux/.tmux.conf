# ═══════════════════════════════════════════════════════════════════
#  ~/.tmux.conf
#
#  Leader is ⌃Space — caps-lock pinky + thumb on your HHKB.
#  Hold nothing else. Press the leader, release, then a plain letter.
#
#  Reload after editing:  ⌃Space  then  r
# ═══════════════════════════════════════════════════════════════════


# ─── The leader ────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space

# Press ⌃Space twice to send a real ⌃Space through to the app
# (neovim completion plugins use it — this is your escape hatch).
bind C-Space send-prefix


# ─── Panes: the same letters vim uses ──────────────────────────────
# v / s match vim's :vsplit and :split. New panes open in the
# directory you were already in, not your home folder.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Capital letters resize. -r means you can hold the letter and repeat
# without pressing the leader again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Already built in and worth knowing: z zooms a pane full-screen,
# x closes it (with a confirmation), space cycles pane layouts.


# ─── Windows (tabs) ────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window

# One key that shows every session and window as a tree, with search.
# This replaces the default `s`, which v/s took over above.
bind w choose-tree -Zs


# ─── Defaults that actually matter ─────────────────────────────────

# THE important one. tmux waits 500ms after Esc by default, which
# makes vim feel broken and laggy. 10ms fixes it.
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on


# ─── Scrollback: vim keys ──────────────────────────────────────────
# ⌃Space then Enter enters copy mode. Then move with hjkl / ⌃u / ⌃d
# and search with / just like vim. v starts a selection, y copies to
# the macOS clipboard, q quits.
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"


# ─── Colors: without these, neovim themes look wrong ───────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB"


# ─── Reload this file ──────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
