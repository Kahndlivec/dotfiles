# ═══════════════════════════════════════════════════════════════════
#  /etc/keyd/thinkpad.conf   —  ThinkPad X13 Gen 3, Italian ISO
#
#  ThinkPads only. The desktops don't need keyd: caps->ctrl is handled
#  by xkb in linux/gnome/setup.sh, and the HHKB does its own thing in
#  firmware.
#
#  Scope, deliberately small: make the ISO keyboard behave like ANSI,
#  and put the HHKB modifiers where your hands expect them. No layers
#  you'd have to relearn.
#
#  FIRST: find your keyboard's id.
#      sudo keyd monitor
#  Type a key. The line shows the device as `vendor:product  name`.
#  The built-in is almost always 0001:0001 (AT Translated Set 2).
#  Put the real value below, then:
#      sudo systemctl restart keyd
#
#  Debug without a reboot:  sudo keyd monitor   (shows in -> out)
# ═══════════════════════════════════════════════════════════════════

[ids]
0001:0001

[main]

# ─── ISO -> ANSI ───────────────────────────────────────────────────
# The extra key an ISO board has between left-shift and Z. With a `us`
# layout it produces nothing useful, and it makes your left shift one
# key narrower than the HHKB's. Folding it into shift restores the
# reach your pinky already knows.
102nd = leftshift

# ─── Modifiers ─────────────────────────────────────────────────────
# Caps is Control on the HHKB (DIP switch) and on the desktops (xkb).
# overload gives you Escape on a tap for free — same key, no cost, and
# it matches the "Right command on hold, Escape when tapped" rule you
# were already running in Karabiner.
capslock = overload(control, esc)

# ─── Arrows, without leaving the home row ──────────────────────────
# Direct port of your Karabiner "MacBook keyboard parity" rule:
#   fn+hjkl -> arrows, fn+u/d -> page, fn+delete -> forward delete
#
# It can't hang off the ThinkPad's own Fn key: that key is handled by
# the embedded controller and never reaches evdev, so keyd can't see
# it. Right Alt takes the role. On a `us` layout you don't need AltGr
# for anything, so nothing is lost.
rightalt = layer(nav)

[nav]

h = left
j = down
k = up
l = right
u = pageup
d = pagedown
backspace = delete        # forward delete

# F-keys, HHKB-style. The X13 has a real F-row, so these are a bonus
# rather than a necessity — delete the block if it gets in the way.
1 = f1
2 = f2
3 = f3
4 = f4
5 = f5
6 = f6
7 = f7
8 = f8
9 = f9
0 = f10
minus = f11
equal = f12

# ═══════════════════════════════════════════════════════════════════
#  Not ported, on purpose:
#
#  "Word motion on Control: ctrl+arrows -> option+arrows"
#      ctrl+arrows IS word motion on Linux. The rule existed only to
#      paper over a macOS quirk. Deleted.
#
#  hhkb-space-layer.json  (hold space: ERDFAS -> { } ( ) < >)
#      It's in your repo but was never enabled in the Karabiner
#      profile. If you want it here:
#          space = overload(symbols, space)
#      with a [symbols] layer mapping e=S-leftbrace, r=S-rightbrace,
#      d=S-9, f=S-0, a=S-comma, s=S-period.
#      Expect misfires when typing fast — that's probably why you left
#      it off.
#
#  hhkb-fn-symbols.json  (keypad codes -> brackets)
#      That's HHKB firmware business. You're keeping a Mac around to
#      re-flash the keymap, so fix it there instead: point the Fn layer
#      at the real bracket keycodes and the translation layer stops
#      being necessary on every OS you ever use.
# ═══════════════════════════════════════════════════════════════════
